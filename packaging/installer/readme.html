<h1>安装前请了解</h1>
<h2>安装位置</h2>
<p>会记将安装到“应用程序”。如已有会记，本次安装只更新应用，保留会议记录和模型。安装前请退出会记。</p>
<h2>模型与环境</h2>
<p>首次打开会记会显示环境检查。已有中文识别模型、Ollama 和 Qwen3 会自动复用，仅需下载缺少的部分。说话人模型已包含在安装包内。</p>
<p>首次准备可能需要联网，并为中文纪要模型预留约 6 GB 空间。也可先只准备转写，稍后补齐纪要。</p>
<h2>系统要求与授权</h2>
<p>需要 Apple Silicon（M 系列芯片）及 macOS 26 或更新版本。开始转写时，系统会请求所需的声音采集权限。</p>
<p>此包为未签名、未公证的测试版安装包。</p>
