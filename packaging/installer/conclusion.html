<h1>会记已安装成功</h1>
<p>你可以关闭安装器，开始使用会记。</p>
<h2>接下来</h2>
<ol>
<li>在访达的“应用程序”中打开“会记”。</li>
<li>确认环境检查结果；已有模型自动复用，缺少的项目点击“一键准备”。</li>
<li>新建会议，点击“开始转写”，按系统提示允许声音采集。</li>
</ol>
<p>安装完成不代表模型已下载；模型准备在会记内进行，可停止、重试或稍后补齐。</p>
</body></html>
